name = "bqp_pspace"
version = "0.1.0"
defaultTargets = ["ShiSpace"]
# Share the pinned dependency checkout with bqp-pp instead of cloning Mathlib twice.
packagesDir = "../bqp-pp/.lake/packages"

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

# The published BQP-to-PP source graph, consumed read-only. Roots are exactly the
